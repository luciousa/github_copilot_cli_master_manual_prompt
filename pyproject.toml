[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-reference-builder"
version = "0.1.0"
description = "Build a navigable Word reference from the modular guide."
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1,<2"]

[project.optional-dependencies]
windows = ["pywin32>=306; sys_platform == 'win32'"]
test = ["pytest>=8,<10"]
research = ["requests>=2.31", "beautifulsoup4>=4.12"]

[project.scripts]
copilot-reference-build = "reference_builder.cli:main"

[tool.setuptools.packages.find]
include = ["reference_builder*"]
